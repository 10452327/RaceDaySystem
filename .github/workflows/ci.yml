name: RaceDay CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore RaceDaySystem.slnx

      - name: Build solution
        run: dotnet build RaceDaySystem.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test RaceDay.Tests/RaceDay.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Build RaceDay API Docker image
        run: docker build -f RaceDay/Dockerfile -t raceday-api:latest .

      - name: Build RaceDay MVC Docker image
        run: docker build -f RaceDay.Mvc/Dockerfile -t raceday-mvc:latest .
